<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pendaftaran Kegiatan</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Tambahan CSS langsung agar navigasi & radio button langsung rapi */
        header nav ul {
            list-style: none; 
            padding: 0;
            margin: 0 0 20px 0;
            display: flex;
            gap: 20px; /* Jarak antar menu */
        }
        header nav ul li a {
            text-decoration: none;
            color: #0066cc;
        }
        header nav ul li a:hover {
            text-decoration: underline;
        }
        /* Membuat radio button luring & daring bersebelahan (ke samping) */
        .radio-group {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 5px;
        }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>

<body>


    <main>
        <script src="main.js"></script>

        <h1>Pendaftaran Kegiatan</h1>
        <figure>

        </figure>
        
        <p class="notice">Kolom bertanda wajib harus diisi.</p>
        
        <form method="get" class="card">
            <label for="nama">Nama lengkap (wajib)</label> 
            <input id="nama" name="nama" type="text" autocomplete="nama" required>
            
            <label for="email">Email (wajib)</label>
            <input id="email" name="email" type="text" autocomplete="email" required>

            <label for="NIM">NIM delapan digit</label>
            <input id="number" name="NIM" type="number" autocomplete="NIM" required>

            <label for="Pilihan kegiatan">Pilihan kegiatan</label> 
            <select id="prodi" name="prodi" required>
                <option value="">Pilih kegiatan</option>
                <option value="trpl">berenang</option>
                <option value="ti">lari</option>
            </select>

            <fieldset>
                <legend>persetujuan</legend> 
                <div class="radio-group">
                    <div class="radio-item">
                        <input id="ya" name="mode" type="radio" value="tidak" required> 
                        <label for="ya">ya</label>
                    </div>
                    <div class="radio-item">
                        <input id="ya" name="mode" type="radio" value="tidak"> 
                        <label for="ya">tidak</label>
                    </div>
                </div>
            </fieldset>  
            
            <button type="submit">kirim</button>
        </form>
    </main>
</body>

</html>
